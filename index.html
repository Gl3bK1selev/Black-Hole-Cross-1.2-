<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Hole - System Diagnostic</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --text: #ffffff;
            --muted: #a3a3a3;
            --border: rgba(255, 255, 255, 0.15);
            --glass: rgba(255, 255, 255, 0.04);
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            color: var(--text);
            background: #000000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* --- ФОН: Космос, мерцающие звезды и кометы --- */
        body::before {
            content: '';
            position: absolute;
            z-index: -1;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background-image: 
                radial-gradient(1px 1px at 20px 30px, #fff, transparent),
                radial-gradient(1px 1px at 90px 80px, #fff, transparent),
                radial-gradient(1px 1px at 160px 60px, #fff, transparent),
                radial-gradient(1px 1px at 230px 110px, #fff, transparent),
                radial-gradient(2px 2px at 300px 50px, #fff, transparent),
                radial-gradient(1px 1px at 350px 140px, #fff, transparent),
                radial-gradient(1px 1px at 420px 90px, #fff, transparent);
            background-size: 500px 200px;
            animation: stars 15s linear infinite;
            opacity: 0.8;
        }

        @keyframes stars {
            0% { background-position: 0 0; }
            100% { background-position: 0 -200px; }
        }

        /* Эффект кометы */
        body::after {
            content: '';
            position: absolute;
            z-index: -1;
            width: 3px;
            height: 3px;
            top: 10%;
            left: 10%;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 10px #fff;
            animation: comet 8s linear infinite;
        }

        @keyframes comet {
            0% {
                transform: translate(0, 0) rotate(45deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            70% {
                opacity: 1;
            }
            100% {
                transform: translate(-500px, 500px) rotate(45deg);
                opacity: 0;
            }
        }

        /* --- Главный блок --- */
        .container {
            max-width: 700px;
            padding: 30px;
            text-align: center;
            transform: translateY(-30px);
        }

        h1 {
            font-family: 'Press Start 2P', cursive;
            font-size: 3rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 20px;
            color: var(--text);
            line-height: 1.2;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
        }

        <p class="subtitle">
            font-family: 'Inter', sans-serif;
            font-size: 1.1rem;
            color: var(--muted);
            margin-bottom: 40px;
            letter-spacing: 0.05em;
        }

        /* --- Кнопки --- */
        .download-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 25px 10px;
            border-radius: 10px;
            text-decoration: none;
            font-family: 'Inter', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text);
            background: var(--glass);
            border: 1px solid var(--border);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), rgba(0, 0, 0, 0.15));
            transition: all 0.3s ease;
        }

        .btn:hover {
            border-color: var(--text);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.25);
        }

        .btn:hover::before {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.35), rgba(0, 0, 0, 0.35));
        }

        .btn h3 {
            margin: 0;
            font-size: 1.5rem;
            letter-spacing: 0.05em;
        }

        .btn span {
            font-size: 0.7rem;
            color: var(--muted);
            margin-top: 12px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        <p class="note">
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            color: var(--muted);
            margin-top: 20px;
            line-height: 1.8;
            letter-spacing: 0.05em;
        }

        .note a {
            color: var(--text);
            text-decoration: none;
        }

        .note a:hover {
            color: var(--muted);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>BLACK HOLE</h1>
        <p class="subtitle">Cross-Platform System Diagnostic Utility</p>

        <div class="download-grid">
            <a href="https://github.com/Gl3bK1selev/Black-Hole-Cross-1.2-Windows-/releases/download/v1.2/Black.Hole.Cross.1.2.Windows.zip" target="_blank" class="btn">
                <h3>WIN</h3>
                <span>Desktop App</span>
            </a>
            <a href="https://github.com/Gl3bK1selev/Black-Hole-Cross-1.2-Windows-/releases/download/v1.2/Black.Hole.Cross.1.2.Linux.zip" target="_blank" class="btn">
                <h3>LINUX</h3>
                <span>Portable App</span>
            </a>
        </div>

        <p class="note">
            Self-contained builds. No additional installations required.<br>
            macOS version is currently in testing.
        </p>
    </div>
</body>
</html>
